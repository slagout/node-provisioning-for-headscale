<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSynQ Node Registration</title>
  <style>
    :root {
      --ink: #111827;
      --slate: #334155;
      --mist: #e2e8f0;
      --paper: #f8fafc;
      --accent: #0f766e;
      --accent-warm: #ea580c;
      --danger: #b91c1c;
      --ok: #047857;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Aptos, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at -10% -10%, #99f6e4 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 10%, #fed7aa 0%, transparent 55%),
        linear-gradient(160deg, #ecfeff, #fff7ed 60%, #f8fafc);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 20px;
      box-shadow: 0 14px 32px rgba(2, 8, 20, 0.12);
      overflow: hidden;
      animation: rise 380ms ease-out;
      backdrop-filter: blur(8px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      padding: 24px 28px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      background: linear-gradient(120deg, rgba(15, 118, 110, 0.10), rgba(234, 88, 12, 0.08));
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.3rem, 2.8vw, 1.8rem);
      letter-spacing: 0.01em;
    }

    .hero p {
      margin: 0;
      color: var(--slate);
      font-size: 0.96rem;
    }

    .content {
      padding: 24px 28px 28px;
      display: grid;
      gap: 14px;
    }

    .hint {
      padding: 10px 12px;
      border-radius: 10px;
      background: #ecfeff;
      color: #0f766e;
      border: 1px solid #99f6e4;
      display: none;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #1e293b;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font: inherit;
      background: white;
      color: #0f172a;
    }

    input[readonly] {
      background: #f1f5f9;
      color: #475569;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.17);
    }

    .mono {
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 0.86rem;
    }

    .meta {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 5px;
    }

    button {
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(120deg, #0f766e, #0ea5a4);
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.03); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .status {
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      display: none;
    }

    .status.ok {
      display: block;
      color: var(--ok);
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
    }

    .status.err {
      display: block;
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fca5a5;
    }

    .footer {
      padding: 0 28px 20px;
      color: #64748b;
      font-size: 0.82rem;
    }

    @media (max-width: 640px) {
      .hero, .content, .footer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>EcoSynQ Node Registration</h1>
      <p>Bind your sovereign edge node to your VOGON wallet on Trading Nations Cloud.</p>
    </header>

    <section class="content">
      <div id="prefill" class="hint"></div>

      <div>
        <label for="region">Node Region</label>
        <select id="region" required>
          <option value="">Select region...</option>
          <option value="austin_tx_usa">Austin, Texas (USA)</option>
          <option value="zurich_ch_europe">Zurich, Switzerland (Europe)</option>
          <option value="london_uk_cw">London, England (Commonwealth-West)</option>
          <option value="abudhabi_uae_mena">Abu Dhabi, UAE (MENA)</option>
          <option value="dakar_sn_wafa">Dakar, Senegal (Western Africa)</option>
          <option value="portlouis_mu_eastafrica">Port Louis, Mauritius (East Africa)</option>
          <option value="libreville_gab_cafa">Libreville, Gabon (Central Africa)</option>
          <option value="gaborone_bw_safrica">Gaborone, Botswana (Southern Africa)</option>
          <option value="tashkent_uz_casia">Tashkent, Uzbekistan (Central Asia)</option>
          <option value="hongkong_cn_apac">Hong Kong, China (Asian Pacific)</option>
          <option value="mysore_in_india">Mysore, India (Indian)</option>
          <option value="stjohns_ag_carib">St Johns, Antigua (Caribbean)</option>
          <option value="panamacity_pa_latam">Panama City, Panama (Latin America)</option>
          <option value="lima_pe_andean">Lima, Peru (Andean)</option>
          <option value="bsas_ar_samer">Buenos Aires, Argentina (Southern South America)</option>
          <option value="floropolis_br_esamer">Florianopolis, Brazil (Eastern South America)</option>
        </select>
      </div>

      <div>
        <label for="node-name">Assigned Node Name</label>
        <input id="node-name" class="mono" type="text" readonly>
        <div class="meta">Pre-populated from QR parameters when available.</div>
      </div>

      <div>
        <label for="vogon-id">VOGON ID (wallet address)</label>
        <input id="vogon-id" class="mono" type="text" placeholder="b58:xxxxxxxxxxxxxxxxxxxx" autocomplete="off" required>
        <div class="meta">Format: b58:&lt;base58 string&gt; (min length 20 after prefix)</div>
      </div>

      <div>
        <label for="access-token">Registration Access Token</label>
        <input id="access-token" class="mono" type="password" autocomplete="off" required>
      </div>

      <button id="submit-btn" type="button">Register Node to Wallet</button>
      <div id="status" class="status"></div>
    </section>

    <footer class="footer">
      Successful submissions receive a server-signed registration receipt.
    </footer>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const payload = {
      node_name: params.get('node_name') || '',
      region: params.get('region') || '',
      datacenter: params.get('datacenter') || '',
      role: params.get('role') || '',
      vogon_id: params.get('vogon_id') || ''
    };

    const nodeNameInput = document.getElementById('node-name');
    const regionInput = document.getElementById('region');
    const vogonInput = document.getElementById('vogon-id');
    const accessTokenInput = document.getElementById('access-token');
    const prefill = document.getElementById('prefill');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    nodeNameInput.value = payload.node_name;
    if (payload.region) {
      regionInput.value = payload.region;
    }
    if (payload.vogon_id) {
      vogonInput.value = payload.vogon_id;
    }

    if (payload.node_name || payload.region || payload.vogon_id) {
      prefill.style.display = 'block';
      prefill.textContent = `QR prefill detected: node=${payload.node_name || '-'} region=${payload.region || '-'}`;
    }

    function showStatus(message, type) {
      status.className = `status ${type === 'ok' ? 'ok' : 'err'}`;
      status.textContent = message;
    }

    function validVogon(vogonId) {
      return /^b58:[1-9A-HJ-NP-Za-km-z]{20,128}$/.test(vogonId);
    }

    submitBtn.addEventListener('click', async () => {
      const region = regionInput.value.trim();
      const node_name = nodeNameInput.value.trim();
      const vogon_id = vogonInput.value.trim();
      const accessToken = accessTokenInput.value;

      if (!region || !node_name || !vogon_id || !accessToken) {
        showStatus('Please complete all required fields.', 'err');
        return;
      }
      if (!validVogon(vogon_id)) {
        showStatus('Invalid VOGON ID. Expected b58:<base58 string>.', 'err');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const response = await fetch('/api/register-node', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            node_name,
            region,
            datacenter: payload.datacenter || 'unknown',
            role: payload.role,
            vogon_id
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          showStatus(result.error || 'Registration failed.', 'err');
          return;
        }

        showStatus(`Registration successful. Proof hash: ${result.hash}`, 'ok');
      } catch (error) {
        showStatus('Network error while contacting registration API.', 'err');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Node to Wallet';
      }
    });
  </script>
</body>
</html>
