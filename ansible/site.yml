---
- name: Bootstrap Headscale client nodes
  hosts: all_nodes
  become: true
  vars:
    tailscale_channel: stable

  tasks:
    - name: Generate unique UTC hostname with milliseconds
      ansible.builtin.shell: >
        echo node-$(date -u +%d%H%M%S%3Nz)-$(date -u +%b | tr '[:upper:]' '[:lower:]')-$(date -u +%Y)
      register: generated_hostname
      changed_when: false

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - jq
        state: present
        update_cache: true

    - name: Install tailscale keyring
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/{{ tailscale_channel }}/ubuntu/noble.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/{{ tailscale_channel }}/ubuntu noble main"
        filename: tailscale
        state: present
      register: tailscale_repo

    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: "{{ tailscale_repo.changed }}"

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Register node in Headscale
      ansible.builtin.command: >
        tailscale up
        --login-server={{ headscale_server_url }}
        --hostname={{ generated_hostname.stdout }}
        --accept-dns=false
        --accept-routes=false
        --advertise-exit-node=false
        --reset
      environment:
        TS_AUTHKEY: "{{ headscale_pre_auth_key }}"
      register: tailscale_up
      changed_when: true

    - name: Wait until online
      ansible.builtin.command: tailscale status --json
      register: ts_status
      retries: 20
      delay: 2
      until: (ts_status.stdout | from_json).Self.Online | default(false) | bool

    - name: Persist registration record
      ansible.builtin.copy:
        dest: "/var/lib/ecosynq/node-registration-{{ generated_hostname.stdout }}.json"
        mode: "0600"
        content: |
          {
            "hostname": "{{ generated_hostname.stdout }}",
            "server_url": "{{ headscale_server_url }}",
            "registered_at": "{{ ansible_date_time.iso8601 }}",
            "status": "active"
          }
